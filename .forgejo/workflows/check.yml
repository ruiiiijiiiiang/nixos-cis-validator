name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: https://github.com/cachix/install-nix-action@v31

      - name: Check formatting
        run: nix fmt -- --check .

      - name: Evaluate flake
        run: nix flake check --no-build --all-systems --show-trace

      - name: Validate NixOS option usage
        run: nix build .#checks.x86_64-linux.catalog --no-link --show-trace
